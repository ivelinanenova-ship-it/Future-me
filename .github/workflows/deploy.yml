# Deployment pipeline for SIT and PROD
#
#   push to develop  ->  SIT   (https://ivelinanenova-ship-it.github.io/Future-me/sit/)
#   push to main     ->  PROD  (https://ivelinanenova-ship-it.github.io/Future-me/)
#
# GitHub Pages supports only one site per repo, so on every deploy
# we assemble both branches: main at the root, develop in the /sit/ folder.

name: Deploy

on:


  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time, so SIT and PROD don't overlap
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Pick the target environment based on the branch
  target:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=sit" >> "$GITHUB_OUTPUT"
          fi

  # 2) Gate to the environment. If "prod" has Required reviewers configured,
  #    the pipeline pauses here and waits for approval.
  #    For an Oracle DB, the SQL migrations will run here, using the environment's secrets.
  approve:
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.env }}
    steps:
      - run: echo "Deploying to ${{ needs.target.outputs.env }} from branch ${GITHUB_REF_NAME}"

  # 3) Assemble the site from both branches
  build:
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - uses: actions/checkout@v4
        with:
          ref: develop
          path: sit

      - name: Assemble site
        run: |
          mkdir -p _site/sit
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' prod/ _site/
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' sit/ _site/sit/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 4) Publish to GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
